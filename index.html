<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Post Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My Post Board</h1>
    <p>Write a message and add it to the board.</p>

    <form id="postForm">
      <label for="postText">Your message</label>
      <textarea id="postText" placeholder="Type something..." required></textarea>
      <button type="submit">Add Post</button>
    </form>

    <section>
      <h2>Posts</h2>
      <ul id="posts"></ul>
    </section>
  </main>
</body>
</html>
